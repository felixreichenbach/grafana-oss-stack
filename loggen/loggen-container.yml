services:
  loggen:
    image: python:3-alpine
    container_name: loggen
    command: python -u /app/loggen.py
    environment:
      # Loki push API (loki.source.api) and OTLP/HTTP (otelcol.receiver.otlp) endpoints on Alloy.
      LOKI_PUSH_URL: http://alloy:9999/loki/api/v1/push
      OTLP_LOGS_URL: http://alloy:4318/v1/logs
      TARGETS: loki,otlp
      # Line format for the Loki path: logfmt (default), json (OTel data model) or plain.
      LOKI_LINE_FORMAT: logfmt
      SERVICE_NAME: archive
      SERVICE_VERSION: 1.0.0
      DEPLOYMENT_ENVIRONMENT: docker
      INTERVAL_SECONDS: "2"
      BATCH_SIZE: "5"
    volumes:
      - ./loggen.py:/app/loggen.py:ro
    depends_on:
      - alloy
    restart: unless-stopped
