services:
  loggen:
    image: python:3-alpine
    container_name: loggen
    command: python -u /app/loggen.py
    environment:
      # Loki push API and OTLP/HTTP endpoints on Alloy. Loki goes to port 3100, the Fleet-managed Adaptive Logs
      # pipeline (adaptive_logs_*_loki_push), which applies the drop rules before writing to Grafana Cloud.
      LOKI_PUSH_URL: http://alloy:3100/loki/api/v1/push
      OTLP_LOGS_URL: http://alloy:4318/v1/logs
      TARGETS: loki,otlp
      # Line format for the Loki path: logfmt (default), json (OTel data model) or plain.
      LOKI_LINE_FORMAT: logfmt
      SERVICE_NAME: archive
      SERVICE_VERSION: 1.0.0
      DEPLOYMENT_ENVIRONMENT: docker
      INTERVAL_SECONDS: "2"
      BATCH_SIZE: "5"
    volumes:
      - ./loggen.py:/app/loggen.py:ro
    depends_on:
      - alloy
    restart: unless-stopped
