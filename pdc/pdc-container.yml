services:
  pdc-agent:
    image: grafana/pdc-agent:latest
    container_name: pdc-agent
    # Only started when requested (docker compose up -d pdc-agent) so the stack runs without PDC credentials.
    profiles:
      - pdc
    command:
      - -log.level
      - ${PDC_LOG_LEVEL:-info}
      - -token
      - ${GCLOUD_PDC_SIGNING_TOKEN:-}
      - -cluster
      - ${GCLOUD_PDC_CLUSTER:-}
      - -gcloud-hosted-grafana-id
      - ${GCLOUD_HOSTED_GRAFANA_ID:-}
    restart: unless-stopped
