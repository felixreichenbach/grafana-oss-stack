services:
  pdc-agent:
    image: grafana/pdc-agent:latest
    container_name: pdc-agent
    command:
      - -token
      - ${GCLOUD_PDC_SIGNING_TOKEN:?set GCLOUD_PDC_SIGNING_TOKEN in .env.cloud}
      - -cluster
      - ${GCLOUD_PDC_CLUSTER:?set GCLOUD_PDC_CLUSTER in .env.cloud}
      - -gcloud-hosted-grafana-id
      - ${GCLOUD_HOSTED_GRAFANA_ID:?set GCLOUD_HOSTED_GRAFANA_ID in .env.cloud}
    restart: unless-stopped
