services:
  mcp-grafana:
    image: grafana/mcp-grafana:latest
    container_name: mcp-grafana
    command:
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --allowed-hosts
      - mcp-grafana:8000
    environment:
      - GRAFANA_URL=${GRAFANA_MCP_URL:-http://grafana:3000}
      # Preferred: a Grafana service account token (Administration > Users and access > Service accounts)
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
      # Fallback for local dev when no token is set
      - GRAFANA_USERNAME=${GRAFANA_MCP_USERNAME:-admin}
      - GRAFANA_PASSWORD=${GRAFANA_MCP_PASSWORD:-admin}
    networks:
      - default
      - grafana
    depends_on:
      - grafana
    restart: unless-stopped
