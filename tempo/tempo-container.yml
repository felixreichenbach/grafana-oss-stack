services:
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: "-target=all -config.file=/etc/config.yml"
    restart: always
    volumes:
      - ./tempo.yml:/etc/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:4317:4317" # Tempo OTLP GRPC
      - "127.0.0.1:4318:4318" # Tempo OTLP HTTP
    networks:
      - default
      - grafana

volumes:
  tempo-data: